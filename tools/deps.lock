# Separate ARM32 pin: 5dfc854 does not compile for ARM32 after a588a0d removed
# its ARM headers. Patches raise C++ to 17, inline Logger::Shared to avoid
# duplicate definitions, and correct ARM LSL carry/shift handling. ARM64 stays
# on the already-validated, unchanged repository prebuilt.
#
# THIRD-PARTY WARNING (review of 5edfb41): building this pin emits compiler
# warnings, among them a snprintf truncation. That is UPSTREAM code, not ours —
# the repo's zero-warning policy governs our own sources, and diverging from the
# pin to silence it would trade a reviewed, hashed dependency for an unreviewed
# local edit. So the build is NOT failed for it and the warning is NOT
# suppressed: test/arm32_dobby_qemu_smoke.sh tees the build log, counts the
# warnings and prints them labelled as third-party, so they cannot vanish into
# a scrollback nobody reads. If upstream fixes it, the pin moves and the count
# drops to zero on its own.
